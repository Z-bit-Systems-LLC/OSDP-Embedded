# C library + tools build/test template — invoked from azure-pipelines.yml's
# `build_c` job. Runs on a Microsoft-hosted `ubuntu-latest` agent (the free
# hosted parallel slot): native x86_64 Linux compile *and* ctest execution.
#
# Split out from the former monolithic build.yml so the C (CMake/ctest) and
# Rust (cargo) stacks run as independent, concurrent jobs. See build-rust.yml
# for the Rust half and azure-pipelines.yml for how the jobs are scheduled
# across the hosted + self-hosted parallel slots.
#
# Note on coverage: per-push test *execution* now happens on Linux (here +
# build-rust.yml), not Windows. The Windows tools are still compiled at
# release time by package.yml; cross-pi.yml builds aarch64 but can't run it.
#
# Like build-rust.yml, the heavy steps skip themselves on the redundant
# branch-push run of a release-bump commit; the v* tag run is unaffected.
# (Full rationale in build-rust.yml's detect step.)

steps:
  - bash: |
      msg="${BUILD_SOURCEVERSIONMESSAGE:-}"
      if [ "$(Build.SourceBranch)" = "refs/heads/main" ] && [ "${msg#Bump version to}" != "$msg" ]; then
        echo "##vso[task.setvariable variable=skipRedundant]true"
        echo "redundant release-bump build → skipping heavy steps"
      else
        echo "##vso[task.setvariable variable=skipRedundant]false"
      fi
    displayName: 'Detect redundant release-bump build'

  # library.json is the one build description in this repo that nothing
  # here compiles — a PlatformIO consumer resolves it from a git tag, so a
  # mistake lands in their firmware build after the tag is immutable. The
  # check is pure PowerShell (pwsh is preinstalled on the hosted agent),
  # takes milliseconds, and deliberately carries no skipRedundant
  # condition: the release-bump commit is precisely the one that rewrites
  # the manifest's version, so that is when the drift check matters most.
  - task: PowerShell@2
    displayName: 'Validate PlatformIO manifest'
    inputs:
      targetType: 'filePath'
      filePath: 'scripts/Test-Manifest.ps1'
      pwsh: true
      failOnStderr: false

  # wolfSSL for ports/wolfcrypt (OSDP_PORT_WOLFCRYPT). Pinned, crypto-only,
  # static, installed outside the source tree and cached: it changes only when
  # the pin or its flags do, so almost every run restores it instead of
  # compiling. -DWOLFSSL_AESECB=yes is the flag that matters — wolfSSL's CMake
  # build leaves AES-ECB off by default and the port #errors without it. To
  # move the pin, change wolfsslRef; to change the flags, bump wolfsslCacheRev
  # too, since the cache key cannot see inside the build script.
  - task: Cache@2
    displayName: 'Cache wolfSSL'
    condition: and(succeeded(), ne(variables['skipRedundant'], 'true'))
    inputs:
      key: 'wolfssl | "$(Agent.OS)" | "$(wolfsslRef)" | "$(wolfsslCacheRev)"'
      path: '$(Pipeline.Workspace)/wolfssl'
      cacheHitVar: WOLFSSL_CACHE_RESTORED

  - task: Bash@3
    displayName: 'Build wolfSSL $(wolfsslRef)'
    condition: and(succeeded(), ne(variables['skipRedundant'], 'true'), ne(variables['WOLFSSL_CACHE_RESTORED'], 'true'))
    inputs:
      targetType: 'inline'
      script: |
        set -euo pipefail
        src="$(Agent.TempDirectory)/wolfssl-src"
        git clone --quiet --depth 1 --branch "$(wolfsslRef)" \
          https://github.com/wolfSSL/wolfssl.git "$src"
        cmake -S "$src" -B "$src/build" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DWOLFSSL_CRYPT_ONLY=yes \
          -DWOLFSSL_AESECB=yes \
          -DWOLFSSL_EXAMPLES=no \
          -DWOLFSSL_CRYPT_TESTS=no \
          -DCMAKE_INSTALL_PREFIX="$(Pipeline.Workspace)/wolfssl"
        cmake --build "$src/build" --parallel
        cmake --install "$src/build"

  # On Linux CMake defaults to the single-config "Unix Makefiles" generator,
  # so the build type is fixed at configure time via CMAKE_BUILD_TYPE; there
  # is no per-build `--config` (that's a multi-config / MSVC concept).
  #
  # OSDP_PORT_WOLFCRYPT adds ports/wolfcrypt, re-runs the SC suite over it as
  # test_*_wolfcrypt, and adds test_port_wolfcrypt — all in the same ctest run.
  - task: Bash@3
    displayName: 'CMake configure (Release)'
    condition: and(succeeded(), ne(variables['skipRedundant'], 'true'))
    inputs:
      targetType: 'inline'
      script: |
        set -euo pipefail
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=$(buildConfiguration) \
          -DOSDP_BUILD_TESTS=ON \
          -DOSDP_BUILD_TOOLS=ON \
          -DOSDP_PORT_WOLFCRYPT=ON \
          -DCMAKE_PREFIX_PATH="$(Pipeline.Workspace)/wolfssl"

  # --parallel keeps all agent cores busy compiling.
  - task: Bash@3
    displayName: 'CMake build (Release)'
    condition: and(succeeded(), ne(variables['skipRedundant'], 'true'))
    inputs:
      targetType: 'inline'
      script: |
        set -euo pipefail
        cmake --build build --parallel

  # --output-junit writes a JUnit XML report (CMake 3.21+) for the Tests tab.
  - task: Bash@3
    displayName: 'ctest (Release)'
    condition: and(succeeded(), ne(variables['skipRedundant'], 'true'))
    inputs:
      targetType: 'inline'
      script: |
        set -euo pipefail
        ctest --test-dir build --output-on-failure --output-junit ctest-results.xml

  # succeededOrFailed() so results still publish when tests fail — that's the
  # point — but skip on the redundant release-bump build (no results there).
  - task: PublishTestResults@2
    displayName: 'Publish test results (C)'
    condition: and(succeededOrFailed(), ne(variables['skipRedundant'], 'true'))
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/ctest-results.xml'
      searchFolder: '$(Build.SourcesDirectory)'
      mergeTestResults: true
      testRunTitle: 'OSDP-Embedded C ($(buildConfiguration))'
